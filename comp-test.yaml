apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-example
  namespace: kubeflow
spec:
  template:
    metadata:
      labels:
        kubeflow-pipelines-api-token: "true"
    spec:
      containers:
      - name: pytorch-container
        image: jaganacr05032025.azurecr.io/kubeflow/mnist-evaluator:latest
        imagePullPolicy: Always
        # command: ["torchrun"]
        # args: ["--epochs", "10"]

        # command: ["python"]
        # args:
        #   - "/opt/kfp_pipeline/src/mnist.py"
        #   - "--output-path"
        #   - "/opt/kfp_pipeline/blob_info.json"
        #   - "--save-model"

        command: ["python"]
        args:
          - "/opt/kfp_pipeline/src/model_evaluate.py"
          - "--container-name"
          - "models"
          - "--model-filename"
          - "mnist.pt"
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
          - mountPath: /var/run/secrets/kubeflow/pipelines
            name: volume-kf-pipeline-token
            readOnly: true
      volumes:
        - name: volume-kf-pipeline-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 7200
                  audience: pipelines.kubeflow.org
      tolerations:
      - key: "sku"
        operator: "Equal"
        value: "gpu"
        effect: "NoSchedule"
      restartPolicy: OnFailure
  backoffLimit: 4
  completions: 1
  parallelism: 2
